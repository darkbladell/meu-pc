Section "Device"
    Identifier "VirtualDevice"
    Driver "dummy"
    VideoRam 256000
EndSection

Section "Monitor"
    Identifier "VirtualMonitor"
    HorizSync 28-80
    VertRefresh 48-75
EndSection

Section "Screen"
    Identifier "VirtualScreen"
    Device "VirtualDevice"
    Monitor "VirtualMonitor"

    DefaultDepth 24

    SubSection "Display"
        Depth 24
        Modes "1280x720"
    EndSubSection
EndSection

Section "ServerLayout"
    Identifier "VirtualLayout"
    Screen "VirtualScreen"
EndSection
